name: Karing Quality Nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: karing-quality-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Read subscription sources
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("subscriptions.txt")
          if not path.exists():
              raise SystemExit("subscriptions.txt is missing")

          urls = []
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue

              parsed = urlparse(line)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise SystemExit(
                      "Every subscription must be a valid HTTPS URL"
                  )
              urls.append(line)

          if not urls:
              raise SystemExit("No subscription URLs configured")

          print("CONFIG_URLS=" + ",".join(urls))
          print(f"SOURCE_COUNT={len(urls)}")
          PY

          echo "Subscription sources loaded: $SOURCE_COUNT"

      - name: Download Mihomo
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = (
              "https://api.github.com/repos/"
              "MetaCubeX/mihomo/releases/latest"
          )
          request = urllib.request.Request(
              api,
              headers={"Accept": "application/vnd.github+json"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          assets = [
              asset for asset in release.get("assets", [])
              if asset["name"].startswith("mihomo-linux-amd64-v1")
              and asset["name"].endswith(".gz")
          ]

          if not assets:
              raise SystemExit(
                  "Could not find a compatible Mihomo Linux AMD64 asset"
              )

          asset = assets[0]
          request = urllib.request.Request(
              asset["browser_download_url"],
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              compressed = response.read()

          binary = gzip.decompress(compressed)
          target = Path("mihomo")
          target.write_bytes(binary)
          target.chmod(0o755)

          print("Mihomo version:", release.get("tag_name", "unknown"))
          PY

      - name: Build speedtest tool
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/KodeBarinn/mihomo-speedtest-rs.git \
            /tmp/mihomo-speedtest-rs

          cargo build --release --locked \
            --manifest-path /tmp/mihomo-speedtest-rs/Cargo.toml

          test -x \
            /tmp/mihomo-speedtest-rs/target/release/mihomo-speedtest

      - name: Run actual speed tests
        shell: bash
        run: |
          mkdir -p output

          /tmp/mihomo-speedtest-rs/target/release/mihomo-speedtest \
            --config "$CONFIG_URLS" \
            --use-mihomo \
            --mihomo-binary "$GITHUB_WORKSPACE/mihomo" \
            --min-download-speed 3 \
            --download-size 20 \
            --timeout 20s \
            --output output/passing.yaml \
            --json \
            > output/speedtest-results.json

      - name: Select the fastest 100 nodes
        run: python scripts/select_top.py

      - name: Show summary
        run: cat output/summary.txt

      - name: Commit updated results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/karing.yaml \
                  output/passing.yaml \
                  output/speedtest-results.json \
                  output/summary.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update quality Karing nodes"
            git push
          fi
